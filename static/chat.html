<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoChat</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
  <script defer src="connect.js"></script>
</head>
<body>
  <main>
    <section id="chatbox-container">
      <div id="all-messages" aria-live="polite" aria-label="Chat messages"></div>
      <div id="typing-indicator" style="display:none;" aria-live="polite"></div>
      <div id="typing-container">
        <form autocomplete="off">
          <div class="input-container">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Your name..." maxlength="20" required />
          </div>
          <div class="input-container">
            <label for="message">Message</label>
            <input type="text" id="message" placeholder="Type your message..." maxlength="200" required />
          </div>
          <button id="send-btn" type="submit">Send</button>
        </form>
      </div>
      <div class="export-feature">
        <button id="export-btn" title="Export chat as JSON">Export Chat (JSON)</button>
      </div>
    </section>
    <footer>
      <p>Made with <span style="color:#10b981;">&#10084;</span> by <strong>EJ</strong> &middot; <a href="https://github.com/ej-edwards/GoChat" target="_blank">GitHub</a></p>
    </footer>
  </main>
</body>
</html>
